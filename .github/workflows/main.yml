name: Telegram Bot to News Publisher

on:
  schedule:
    - cron: '*/5 * * * *' # يفحص الرسائل الجديدة كل 5 دقائق
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and Process Telegram Messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python -c "
          import urllib.request
          import json
          import os

          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          channel_id = os.environ.get('TELEGRAM_CHANNEL_ID')

          url = f'https://api.telegram.org/bot{token}/getUpdates'
          try:
              req = urllib.request.urlopen(url)
              data = json.loads(req.read().decode())
              print('Successfully connected to Telegram Bot API!')
          except Exception as e:
              print(f'Error connecting: {e}')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto update news from Telegram"
          git push
